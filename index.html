<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay Two Images</title>
<style>
  /* Container to hold both images */
  .image-container {
    position: relative; /* Needed for absolute positioning of children */
    display: inline-block;
  }

  /* Base (background) image */
  .image-container img.background {
    display: block;
    width: 400px; /* Adjust size as needed */
    height: auto;
  }

  /* Overlay (foreground) image */
  .image-container img.overlay {
    position: absolute;
    top: center;   /* Align to top of container */
    left: center;  /* Align to left of container */
    width: 40px; /* Match background width */
    height: auto;
    opacity: 0.7; /* Make overlay semi-transparent */
    pointer-events: none; /* Allow clicks to pass through if needed */
  }
</style>
</head>
<body>

<div class="image-container">
  <!-- Background image -->
  <img src="https://thecheesecellar.com/wp-content/uploads/2024/01/Lemon-Farm-Tour-1024x585.jpg"" alt="Background" class="background">
  
  <!-- Overlay image -->
  <img class="overlay" src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExd2Fnc2d2NXJzb3k5cG4weGE0MXc2am84M3RkeXJtaGN5eWwyMjA1YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/QVPU8Yp9cK5Xx6BuN3/giphy.gif">
</div>
